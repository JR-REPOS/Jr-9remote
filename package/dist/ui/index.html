<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9Remote</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
      // Apply saved theme before render to prevent flash
      const savedTheme = localStorage.getItem("9remote-theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
    <script type="module" crossorigin src="/assets/index-H_1CAVCP.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CcS6AXZF.css">
  </head>
  <body>
    <div id="root"></div>
  <style>
  .ai-fab { position: fixed; bottom: 24px; right: 24px; width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 9999; transition: transform 0.2s ease, box-shadow 0.2s ease; border: none; }
  .ai-fab:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(99, 102, 241, 0.6); }
  .ai-drawer-overlay { position: fixed; display: none; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 10000; display: none; opacity: 0; transition: opacity 0.2s ease; }
  .ai-drawer-overlay.open { pointer-events: auto; display: flex !important; justify-content: flex-end; opacity: 1; }
  .ai-drawer { width: 100%; max-width: 520px; height: 100%; background: var(--card-bg, #1e1e2e); color: var(--text-main, #f3f4f6); display: flex; flex-direction: column; box-shadow: -4px 0 24px rgba(0,0,0,0.5); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .ai-header { padding: 16px 20px; border-bottom: 1px solid var(--border-subtle, rgba(255,255,255,0.1)); display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); }
  .ai-header-title { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
  .ai-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .ai-msg { max-width: 88%; padding: 12px 16px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; word-break: break-word; }
  .ai-msg-user { align-self: flex-end; background: #6366f1; color: white; border-bottom-right-radius: 2px; }
  .ai-msg-assistant { align-self: flex-start; background: var(--row-bg, rgba(255,255,255,0.06)); border: 1px solid var(--border-subtle, rgba(255,255,255,0.1)); color: var(--text-main, #e5e7eb); border-bottom-left-radius: 2px; }
  .ai-code-block { background: #111827; border-radius: 8px; padding: 12px; margin: 8px 0; font-family: "JetBrains Mono", monospace; font-size: 12px; position: relative; overflow-x: auto; color: #38bdf8; border: 1px solid rgba(255,255,255,0.1); }
  .ai-code-actions { display: flex; gap: 8px; margin-top: 8px; }
  .ai-btn-action { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: background 0.2s; }
  .ai-btn-action:hover { background: rgba(255,255,255,0.2); }
  .ai-btn-run { background: #10b981; border: none; }
  .ai-btn-run:hover { background: #059669; }
  .ai-input-area { padding: 16px; border-top: 1px solid var(--border-subtle, rgba(255,255,255,0.1)); background: rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 10px; }
  .ai-textarea { width: 100%; min-height: 50px; max-height: 120px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle, rgba(255,255,255,0.15)); border-radius: 8px; color: #fff; padding: 10px 12px; font-size: 13.5px; outline: none; resize: none; }
  .ai-settings-modal { position: absolute; inset: 0; background: var(--card-bg, #1e1e2e); z-index: 10; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
  .ai-settings-modal.open { display: flex; }
</style>
<button class="ai-fab" id="aiFab" title="Open 9Remote AI Assistant">
  <span class="material-symbols-rounded" style="font-size: 28px;">smart_toy</span>
</button>
<div class="ai-drawer-overlay" id="aiOverlay">
  <div class="ai-drawer">
    <div class="ai-header">
      <div class="ai-header-title">
        <span class="material-symbols-rounded" style="color:#a855f7;">smart_toy</span>
        <span>9Remote AI Assistant</span>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <select id="aiProviderSelect" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:4px 8px; border-radius:6px; font-size:12px;">
          <option value="openai">OpenAI (gpt-4o)</option>
          <option value="openrouter">OpenRouter</option>
          <option value="opencode">OpenCode</option>
          <option value="kilocode">KiloCode</option>
          <option value="custom">Custom Provider</option>
        </select>
        <button id="aiSettingsBtn" class="ai-btn-action" title="AI Settings">
          <span class="material-symbols-rounded" style="font-size:16px;">settings</span>
        </button>
        <button id="aiCloseBtn" class="ai-btn-action" style="padding:4px;">
          <span class="material-symbols-rounded" style="font-size:18px;">close</span>
        </button>
      </div>
    </div>
    <div class="ai-messages" id="aiMessages">
      <div class="ai-msg ai-msg-assistant">
        👋 Hi! I am your 9Remote AI assistant. I can inspect system state, help run terminal commands, debug code, or answer questions. How can I help you today?
      </div>
    </div>
    <div class="ai-input-area">
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-muted, #9ca3af);">
        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
          <input type="checkbox" id="aiIncludeTerminalCtx" checked /> Include Terminal Context
        </label>
        <button id="aiClearBtn" style="background:none; border:none; color:#9ca3af; cursor:pointer; font-size:11px;">Clear History</button>
      </div>
      <div style="display:flex; gap:8px; align-items:flex-end;">
        <textarea id="aiInput" class="ai-textarea" placeholder="Type a message or command request... (Enter to send)"></textarea>
        <button id="aiSendBtn" class="ai-fab" style="position:static; width:44px; height:44px; border-radius:8px; flex-shrink:0;">
          <span class="material-symbols-rounded" style="font-size:20px;">send</span>
        </button>
      </div>
    </div>
    <div class="ai-settings-modal" id="aiSettingsModal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="margin:0; font-size:16px; font-weight:600;">AI Provider Settings</h3>
        <button id="aiCloseSettingsBtn" class="ai-btn-action">
          <span class="material-symbols-rounded" style="font-size:16px;">close</span>
        </button>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px; font-size:13px;">
        <div>
          <label style="display:block; margin-bottom:4px; font-weight:500;">Active Provider</label>
          <select id="aiActiveProviderSetting" style="width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px; border-radius:6px;">
            <option value="openai">OpenAI</option>
            <option value="openrouter">OpenRouter</option>
            <option value="opencode">OpenCode</option>
            <option value="kilocode">KiloCode</option>
            <option value="custom">Custom Provider</option>
          </select>
        </div>
        <div>
          <label style="display:block; margin-bottom:4px; font-weight:500;">Base URL</label>
          <input type="text" id="aiBaseUrlInput" style="width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px; border-radius:6px;" placeholder="https://api.openai.com/v1" />
        </div>
        <div>
          <label style="display:block; margin-bottom:4px; font-weight:500;">API Key</label>
          <input type="password" id="aiApiKeyInput" style="width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px; border-radius:6px;" placeholder="sk-..." />
        </div>
        <div>
          <label style="display:block; margin-bottom:4px; font-weight:500;">Model Name</label>
          <input type="text" id="aiModelInput" style="width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px; border-radius:6px;" placeholder="gpt-4o" />
        </div>
        <div>
          <label style="display:block; margin-bottom:4px; font-weight:500;">System Instructions</label>
          <textarea id="aiSystemPromptInput" style="width:100%; height:80px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px; border-radius:6px; font-size:12px; resize:none;"></textarea>
        </div>
        <button id="aiSaveSettingsBtn" class="ai-btn-action ai-btn-run" style="justify-content:center; padding:10px; margin-top:10px; font-weight:600;">
          Save Settings
        </button>
      </div>
    </div>
  </div>
</div>
<script>
(function() {
  let aiConfig = null;
  let chatHistory = [];
  const fab = document.getElementById("aiFab");
  const overlay = document.getElementById("aiOverlay");
  const closeBtn = document.getElementById("aiCloseBtn");
  const providerSelect = document.getElementById("aiProviderSelect");
  const settingsBtn = document.getElementById("aiSettingsBtn");
  const settingsModal = document.getElementById("aiSettingsModal");
  const closeSettingsBtn = document.getElementById("aiCloseSettingsBtn");
  const saveSettingsBtn = document.getElementById("aiSaveSettingsBtn");
  const messagesContainer = document.getElementById("aiMessages");
  const input = document.getElementById("aiInput");
  const sendBtn = document.getElementById("aiSendBtn");
  const clearBtn = document.getElementById("aiClearBtn");
  async function loadConfig() {
    try {
      let res = await fetch("/api/ai/config");
      let data = await res.json();
      if (data.success && data.config) {
        aiConfig = data.config;
        updateUIWithConfig();
      }
    } catch (err) { console.error("Failed to load AI config", err); }
  }
  function updateUIWithConfig() {
    if (!aiConfig) return;
    providerSelect.value = aiConfig.activeProviderId || "openai";
    document.getElementById("aiActiveProviderSetting").value = aiConfig.activeProviderId || "openai";
    let activeP = (aiConfig.providers || []).find(p => p.id === providerSelect.value) || (aiConfig.providers || [])[0];
    if (activeP) {
      document.getElementById("aiBaseUrlInput").value = activeP.baseUrl || "";
      document.getElementById("aiApiKeyInput").value = activeP.apiKey || "";
      document.getElementById("aiModelInput").value = activeP.model || "";
    }
    document.getElementById("aiSystemPromptInput").value = aiConfig.systemPrompt || "";
  }
  fab.addEventListener("click", () => { overlay.style.display = "flex"; overlay.classList.add("open"); loadConfig(); input.focus(); });
  closeBtn.addEventListener("click", () => overlay.classList.remove("open"));
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("open"); });
  settingsBtn.addEventListener("click", () => { updateUIWithConfig(); settingsModal.classList.add("open"); });
  closeSettingsBtn.addEventListener("click", () => settingsModal.classList.remove("open"));
  document.getElementById("aiActiveProviderSetting").addEventListener("change", (e) => {
    let pId = e.target.value;
    let p = (aiConfig && aiConfig.providers || []).find(item => item.id === pId);
    if (p) {
      document.getElementById("aiBaseUrlInput").value = p.baseUrl || "";
      document.getElementById("aiApiKeyInput").value = p.apiKey || "";
      document.getElementById("aiModelInput").value = p.model || "";
    }
  });
  providerSelect.addEventListener("change", async (e) => {
    if (!aiConfig) return;
    aiConfig.activeProviderId = e.target.value;
    await fetch("/api/ai/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ config: aiConfig }) });
  });
  saveSettingsBtn.addEventListener("click", async () => {
    let activeId = document.getElementById("aiActiveProviderSetting").value;
    let baseUrl = document.getElementById("aiBaseUrlInput").value.trim();
    let apiKey = document.getElementById("aiApiKeyInput").value.trim();
    let model = document.getElementById("aiModelInput").value.trim();
    let systemPrompt = document.getElementById("aiSystemPromptInput").value.trim();
    if (!aiConfig) aiConfig = { providers: [] };
    aiConfig.activeProviderId = activeId;
    aiConfig.systemPrompt = systemPrompt;
    let pIndex = (aiConfig.providers || []).findIndex(p => p.id === activeId);
    if (pIndex !== -1) {
      aiConfig.providers[pIndex].baseUrl = baseUrl;
      aiConfig.providers[pIndex].apiKey = apiKey;
      aiConfig.providers[pIndex].model = model;
    } else {
      aiConfig.providers.push({ id: activeId, name: activeId, baseUrl, apiKey, model });
    }
    await fetch("/api/ai/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ config: aiConfig }) });
    providerSelect.value = activeId;
    settingsModal.classList.remove("open");
  });
  clearBtn.addEventListener("click", () => {
    chatHistory = [];
    messagesContainer.innerHTML = "<div class="ai-msg ai-msg-assistant">Cleared chat history. How can I help you now?</div>";
  });
  function appendMessage(role, text) {
    let msgDiv = document.createElement("div");
    msgDiv.className = "ai-msg " + (role === "user" ? "ai-msg-user" : "ai-msg-assistant");
    let fence = "```";
    if (text.includes(fence)) {
      let parts = text.split(new RegExp("(" + fence + "[\s\S]*?" + fence + ")", "g"));
      parts.forEach(part => {
        if (part.startsWith(fence) && part.endsWith(fence)) {
          let codeContent = part.slice(3, -3).replace(/^[a-zA-Z0-9_-]+
/, "");
          let codeBlock = document.createElement("div");
          codeBlock.className = "ai-code-block";
          codeBlock.textContent = codeContent;
          let actions = document.createElement("div");
          actions.className = "ai-code-actions";
          let copyBtn = document.createElement("button");
          copyBtn.className = "ai-btn-action";
          copyBtn.innerHTML = "<span class="material-symbols-rounded" style="font-size:14px;">content_copy</span> Copy";
          copyBtn.onclick = () => { navigator.clipboard.writeText(codeContent); copyBtn.textContent = "Copied!"; setTimeout(() => copyBtn.innerHTML = "<span class="material-symbols-rounded" style="font-size:14px;">content_copy</span> Copy", 2000); };
          let runBtn = document.createElement("button");
          runBtn.className = "ai-btn-action ai-btn-run";
          runBtn.innerHTML = "<span class="material-symbols-rounded" style="font-size:14px;">terminal</span> Run in Terminal";
          runBtn.onclick = () => runInTerminal(codeContent);
          actions.appendChild(copyBtn);
          actions.appendChild(runBtn);
          codeBlock.appendChild(actions);
          msgDiv.appendChild(codeBlock);
        } else if (part.trim()) {
          let span = document.createElement("span");
          span.textContent = part;
          msgDiv.appendChild(span);
        }
      });
    } else { msgDiv.textContent = text; }
    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    return msgDiv;
  }

  function runInTerminal(cmd) {
    if (window.activeSocket || window.socket) {
      let sock = window.activeSocket || window.socket;
      sock.emit('data', cmd + '
');
      sock.emit('terminal:data', cmd + '
');
    }
    navigator.clipboard.writeText(cmd);
    let banner = document.createElement('div');
    banner.style.position = 'fixed';
    banner.style.top = '20px';
    banner.style.right = '20px';
    banner.style.background = '#10b981';
    banner.style.color = '#fff';
    banner.style.padding = '10px 16px';
    banner.style.borderRadius = '8px';
    banner.style.zIndex = '10001';
    banner.style.fontSize = '13px';
    banner.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
    banner.textContent = 'Command sent to Terminal and copied to clipboard!';
    document.body.appendChild(banner);
    setTimeout(() => banner.remove(), 2500);
  }

  async function sendMessage() {
    let userText = input.value.trim();
    if (!userText) return;
    input.value = "";
    appendMessage("user", userText);
    chatHistory.push({ role: "user", content: userText });
    let assistantMsgDiv = appendMessage("assistant", "Thinking...");
    assistantMsgDiv.textContent = "";
    let includeContext = document.getElementById("aiIncludeTerminalCtx").checked;
    let context = {};
    if (includeContext) { context.cwd = window.location.pathname; }
    try {
      let res = await fetch("/api/ai/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: chatHistory, providerId: providerSelect.value, context })
      });
      if (!res.ok) {
        let errJson = await res.json().catch(() => ({ error: "Unknown error" }));
        assistantMsgDiv.textContent = "Error: " + (errJson.error || res.statusText);
        return;
      }
      let reader = res.body.getReader();
      let decoder = new TextDecoder();
      let fullContent = "";
      let sseBuffer = "";
      while (true) {
        let { done, value } = await reader.read();
        if (done) break;
        sseBuffer += decoder.decode(value, { stream: true });
        let lines = sseBuffer.split("
");
        sseBuffer = lines.pop() || "";
        for (let line of lines) {
          let trimmed = line.trim();
          if (trimmed.startsWith("data: ")) {
            let jsonStr = trimmed.slice(6).trim();
            if (jsonStr === "[DONE]") break;
            try {
              let parsed = JSON.parse(jsonStr);
              let delta = parsed.choices && parsed.choices[0] && parsed.choices[0].delta && parsed.choices[0].delta.content || "";
              fullContent += delta;
              assistantMsgDiv.textContent = fullContent;
              messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } catch (e) {}
          }
        }
      }
      if (sseBuffer.trim().startsWith("data: ")) {
        let jsonStr = sseBuffer.trim().slice(6).trim();
        if (jsonStr !== "[DONE]") {
          try {
            let parsed = JSON.parse(jsonStr);
            let delta = parsed.choices && parsed.choices[0] && parsed.choices[0].delta && parsed.choices[0].delta.content || "";
            fullContent += delta;
          } catch (e) {}
        }
      }
      chatHistory.push({ role: "assistant", content: fullContent });
      messagesContainer.removeChild(assistantMsgDiv);
      appendMessage("assistant", fullContent);
    } catch (err) { assistantMsgDiv.textContent = "Connection error: " + err.message; }
  }
  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  loadConfig();
})();
</script>
</body>
</html>
